<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">GeoQuest — Explore the world. Make your mark.</title>
  <desc id="description">A medium-blue banner with an illustrated globe, orbit lines, and a marker. Pick a name for your greetings and explore world capitals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#235893"/>
      <stop offset="1" stop-color="#397BB5"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ADD9FF"/>
      <stop offset="1" stop-color="#64ACED"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E0F0FF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="sphere">
      <circle cx="931" cy="181" r="112"/>
    </clipPath>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 339H1200" stroke="#A5D1F5" stroke-opacity=".12"/>
  <circle cx="68" cy="62" r="5" fill="#C5E7FF"/>
  <text x="86" y="67" fill="#E3EFFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3">GEOQUEST / CAPITALS CHALLENGE</text>
  <text x="62" y="144" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Explore the world.</text>
  <text x="62" y="214" fill="#D6EDFF" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Make your mark.</text>
  <text x="66" y="256" fill="#E3EFFC" font-family="Segoe UI, Arial, sans-serif" font-size="18">Pick a name. Play. Discover the world.</text>
  <rect x="66" y="285" width="230" height="31" rx="15.5" fill="#21558F" stroke="#78AADA"/>
  <text x="181" y="305" text-anchor="middle" fill="#F0F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">NO ACCOUNTS. JUST GEOGRAPHY.</text>
  <circle cx="931" cy="181" r="145" fill="none" stroke="#C5E7FF" stroke-opacity=".13" stroke-dasharray="3 10"/>
  <circle cx="931" cy="181" r="127" fill="none" stroke="#C5E7FF" stroke-opacity=".18"/>
  <circle cx="931" cy="181" r="112" fill="url(#globe)"/>
  <g clip-path="url(#sphere)" fill="none" stroke="#286394" stroke-width="1.3" stroke-opacity=".55">
    <ellipse cx="931" cy="181" rx="74" ry="112"/>
    <ellipse cx="931" cy="181" rx="33" ry="112"/>
    <ellipse cx="931" cy="181" rx="112" ry="72"/>
    <ellipse cx="931" cy="181" rx="112" ry="30"/>
    <path d="M819 181H1043M931 69V293"/>
  </g>
  <ellipse cx="931" cy="181" rx="180" ry="40" transform="rotate(-25 931 181)" fill="none" stroke="#E0F2FF" stroke-opacity=".48" stroke-width="1.5"/>
  <path d="M979 101C979 87 990 76 1004 76S1029 87 1029 101C1029 118 1004 139 1004 139S979 118 979 101Z" fill="#f5d88c" stroke="#1E4C7C" stroke-width="4"/>
  <circle cx="1004" cy="101" r="7" fill="#235893"/>
  <circle cx="787" cy="251" r="5" fill="#E6F5FF"/>
  <path d="M1097 273V285M1091 279H1103" stroke="#D6EDFF" stroke-width="2"/>
  <circle cx="814" cy="65" r="2.5" fill="#f5d88c"/>
  <text x="1138" y="326" text-anchor="end" fill="#F2F8FF" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2">EXPLORE / ANSWER / REPEAT</text>
</svg>
