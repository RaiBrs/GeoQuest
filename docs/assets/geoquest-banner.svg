<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">GeoQuest — Explore the world. Make your mark.</title>
  <desc id="description">Dark GeoQuest banner with a blue wireframe globe. Play Capitals, Survival, or unlimited questions in 60 seconds. Continue as a visitor or sign in with Google or GitHub. Available in English and Brazilian Portuguese.</desc>
  <defs>
    <clipPath id="globe-clip"><circle cx="1000" cy="172" r="82"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="1199" height="339" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M12 1H1188Q1199 1 1199 12V44H1V12Q1 1 12 1Z" fill="#010409"/>
  <path d="M1 44H1199M1 303H1199" stroke="#30363d"/>
  <g transform="translate(20 10)">
    <rect width="24" height="24" rx="7" fill="#2766b3"/>
    <g fill="none" stroke="#fff" stroke-width="1.2">
      <circle cx="12" cy="12" r="7.5"/>
      <ellipse cx="12" cy="12" rx="3" ry="7.5"/>
      <path d="M4.5 12h15"/>
    </g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="55" y="27" fill="#e6edf3" font-size="14" font-weight="650">GeoQuest</text>
    <text x="130" y="27" fill="#30363d" font-size="18">/</text>
    <text x="152" y="27" fill="#9da7b3" font-size="12">Geographic challenges</text>
    <text x="1176" y="27" text-anchor="end" fill="#9da7b3" font-size="11" letter-spacing="1">EXPLORE · ANSWER · REPEAT</text>
    <text x="44" y="83" fill="#58a6ff" font-size="11" font-weight="600" letter-spacing="2">YOUR NEXT CHALLENGE</text>
    <text x="42" y="139" fill="#e6edf3" font-size="50" font-weight="700" letter-spacing="-1.5">Explore the world.</text>
    <text x="42" y="193" fill="#9da7b3" font-size="50" font-weight="700" letter-spacing="-1.5">Make your mark.</text>
    <text x="44" y="227" fill="#9da7b3" font-size="16">Countries, capitals, and three ways to test your knowledge.</text>
    <g transform="translate(44 249)">
      <rect width="128" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
      <circle cx="17" cy="15" r="4" fill="#58a6ff"/>
      <text x="31" y="20" fill="#e6edf3" font-size="12">10 questions</text>
    </g>
    <g transform="translate(184 249)">
      <rect width="176" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
      <circle cx="17" cy="15" r="4" fill="#3fb950"/>
      <text x="31" y="20" fill="#e6edf3" font-size="12">One-mistake survival</text>
    </g>
    <g transform="translate(372 249)">
      <rect width="154" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
      <circle cx="17" cy="15" r="4" fill="#e3b341"/>
      <text x="31" y="20" fill="#e6edf3" font-size="12">60s · unlimited</text>
    </g>
    <text x="44" y="326" fill="#9da7b3" font-size="12">Play as a visitor · Sign in with Google or GitHub</text>
    <text x="1156" y="326" text-anchor="end" fill="#9da7b3" font-size="12">EN / PT-BR</text>
  </g>
  <g fill="none" stroke="#58a6ff">
    <circle cx="1000" cy="172" r="111" stroke-opacity=".2" stroke-dasharray="2 9"/>
    <circle cx="1000" cy="172" r="96" stroke-opacity=".16"/>
    <circle cx="1000" cy="172" r="82" fill="#161b22" stroke-opacity=".8"/>
    <g clip-path="url(#globe-clip)" stroke-opacity=".34" stroke-width="1.2">
      <ellipse cx="1000" cy="172" rx="55" ry="82"/>
      <ellipse cx="1000" cy="172" rx="24" ry="82"/>
      <ellipse cx="1000" cy="172" rx="82" ry="54"/>
      <ellipse cx="1000" cy="172" rx="82" ry="23"/>
      <path d="M918 172h164M1000 90v164"/>
    </g>
    <ellipse cx="1000" cy="172" rx="146" ry="35" transform="rotate(-28 1000 172)" stroke-opacity=".45"/>
    <path d="M837 172h20M1143 172h20M1000 13v20" stroke-opacity=".15"/>
  </g>
  <circle cx="1054" cy="128" r="10" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".6"/>
  <circle cx="1054" cy="128" r="4" fill="#58a6ff"/>
  <circle cx="870" cy="240" r="3" fill="#58a6ff"/>
  <circle cx="1125" cy="102" r="3" fill="#3fb950"/>
