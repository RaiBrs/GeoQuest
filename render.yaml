# Render builds the full Java application and frontend from the repository Dockerfile.
# One instance is intentional: active rounds still live in process memory.
services:
  - type: web
    name: geoquest
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8080"
      - key: ACCOUNTS_ENABLED
        value: "true"
      - key: APP_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
